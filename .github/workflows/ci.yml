name: CI

on:
  push:
    branches: [main, reliability-upgrade]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host/pi_web_control
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: host/pi_web_control/requirements.txt

      - name: Install host dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Python syntax check
        run: python -m py_compile app.py

      - name: Run host tests
        run: pytest -q tests

      - name: Shell syntax checks
        working-directory: .
        run: |
          bash -n host/pi_web_control/scripts/boot_update.sh
          bash -n host/pi_web_control/scripts/confirm_release.sh

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi ninja-build

      - name: Fetch Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.1.1
          path: pico-sdk
          submodules: recursive

      - name: Configure firmware
        run: >
          cmake
          -G Ninja
          -S firmware/pico_motor_controller
          -B build/pico_motor_controller
          -DPICO_SDK_PATH=${{ github.workspace }}/pico-sdk

      - name: Build firmware
        run: cmake --build build/pico_motor_controller --parallel 2

      - name: Verify watchdog is compiled into source
        run: |
          grep -q "COMMAND_WATCHDOG_MS = 400" firmware/pico_motor_controller/src/main.cpp
          grep -q "enforce_motion_watchdog" firmware/pico_motor_controller/src/main.cpp
